<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案例演示页面</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#fff;
    padding:30px;
    border-radius:12px;
    width:320px;
    box-shadow:0 0 20px rgba(0,0,0,.1);
}
input{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    width:100%;
    padding:10px;
    background:#1677ff;
    color:#fff;
    border:none;
    cursor:pointer;
}
.watermark{
    margin-top:15px;
    color:#c00;
    text-align:center;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="box">
    <h2>账号验证（案例演示）</h2>

    <input id="user" placeholder="输入账号">
    <input id="pass" type="password" placeholder="输入密码">

    <button onclick="demo()">确认</button>

    <div class="watermark">
        本页面仅用于反诈宣传视频拍摄
    </div>
</div>

<script>
function demo(){
    alert("演示模式：未提交任何数据");
}
</script>

</body>
</html>
